<section class="admin-page"><div class="page-heading"><div><p class="eyebrow">Super admin</p><h1>Staff users</h1><p class="muted">Create staff accounts, then assign them to individual stores.</p></div></div><p class="form-error" ng-if="vm.error" ng-bind="vm.error"></p>
  <div class="two-column narrow-side"><section class="panel"><div class="panel-heading"><h2>All users</h2></div><div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Access</th><th>Status</th><th></th></tr></thead><tbody><tr ng-repeat="user in vm.users"><td>{{user.full_name || '—'}}</td><td ng-bind="user.email"></td><td>{{user.is_superuser ? 'Super admin' : 'Store staff'}}</td><td><span class="status-pill" ng-class="user.is_active ? 'status-active' : 'status-inactive'">{{user.is_active ? 'active' : 'inactive'}}</span></td><td><button class="button button-small button-ghost" ng-click="vm.toggle(user)">{{user.is_active ? 'Deactivate' : 'Activate'}}</button></td></tr></tbody></table></div></section>
  <aside class="panel"><div class="panel-heading"><h2>Create user</h2></div><form class="stack-form" ng-submit="vm.create()"><label>Full name<input ng-model="vm.form.full_name" required></label><label>Email<input type="email" ng-model="vm.form.email" required></label><label>Temporary password<input type="password" minlength="8" ng-model="vm.form.password" required></label><label class="check-label"><input type="checkbox" ng-model="vm.form.is_superuser"> Super admin access</label><button class="button button-primary" ng-disabled="vm.saving">{{vm.saving ? 'Creating…' : 'Create user'}}</button></form></aside></div>
</section>
